# pi-board-agent — Docker Compose (Raspberry Pi / always-on container).
#
# Usage:
#   cp .env.example .env     # fill GH_TOKEN / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID / API key
#   docker compose up -d --build
#
# The target repo (board-game-organizer) is mounted at /workspace and must
# contain .pi/board-agent.yml (run /board-agent init + edit project.number,
# set auto_start: true). `.pi` state (context, inflight, watchdog/refine
# state) is persisted under the named volume so restarts are safe.

services:
  board-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-board-agent:latest
    platform: linux/arm64      # or amd64 for non-Pi hosts
    container_name: pi-board-agent
    restart: unless-stopped
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Provider/API key for the pi models (builder/refine/watch, default
      # deepseek-v4-flash-0731). e.g. ANTHROPIC_API_KEY or the DeepSeek key
      # matching your pi provider config.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # The target repository the board-agent operates on (must have a
      # .pi/board-agent.yml with project.number, columns, auto_start: true).
      - ./repos/board-game-organizer:/workspace
      # Board-agent + pi-dynamic-workflows source (for dev: edit and reload).
      - .:/app/pi-board-agent
      # Persistent pi + board state (sessions, context, inflight, etc).
      - pi-agent-home:/root/.pi/agent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pi-agent-home: