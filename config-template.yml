# .pi/board-agent.yml (project overrides ~/.pi/board-agent.yml).
# Required: project.number and an existing Project with the fields below.
# Startup/lint never rewrite this file or the Project schema.
# Stop/drain before changing config; restart Pi after changing the pinned package.
# No hot update: heartbeat/UI/ordinary admission do not rescan package Git.
project:
  owner: "" # empty -> origin repository owner
  number: 0 # REQUIRED: the Project v2 number

# Required single-select Status options (case-insensitive).
columns:
  ready: "Ready"
  building: "In Progress"
  review: "Review"
  done: "Done"
  needs_human: "Needs Human"
  backlog: "Backlog" # optional manual holding column; never scheduled
status_field: "Status"
type_field: "Type" # single-select, with a Task option
plan_field: "Plan" # optional grouping: neither this field nor a value is required

# Shared budget: builders + one independent reviewer. Paused/uncertain runs
# still occupy a slot. Range 1..16; polling retains provider backoff.
max_workers: 2
tick_seconds: 90
branches:
  base: "main"
  task_prefix: "task/"
task_merge_strategy: "merge" # new results have base/task parents; normal base push only

builder_timeout_ms: 21600000 # optional; 6 hours per attempt
builder_retries: 1
models:
  builder: "deepseek-v4-flash-0731"
  review: "deepseek-v4-flash-0731"
review:
  timeout_ms: 600000 # AI review is always enabled

# Ready -> In Progress -> Review -> Done (Issue stays OPEN).
# A human validates and closes Done to approve merge/push/cleanup.
# Needs Human requires a trusted reply AND a manual move back to Ready.
context:
  enabled: true
  max_chars: 20000
  exclude: []
telegram:
  enabled: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"
  "on": ["needs_human"]
auto_start: false
safety:
  require_clean_worktree: true # gates new launches, not existing-run recovery
bot_identity: "" # empty -> gh-authenticated user
