# pi-board-agent configuration
#
# Lives at `.pi/board-agent.yml` in your project (or `~/.pi/board-agent.yml` for
# defaults across projects — project-level overrides global). All fields are
# optional unless marked REQUIRED.

# ── GitHub Project (v2) ─────────────────────────────────────────────────────
project:
  # GitHub user or org that owns the Project (v2).
  # Leave empty -> auto-detected from `git remote get-url origin`.
  owner: ""
  # REQUIRED. Project number — the N in
  # https://github.com/users/<owner>/projects/<N>
  number: 0

# ── Board columns (Status field) ────────────────────────────────────────────
# Names must match the option labels of the project's single-select `Status`
# field exactly (case-insensitive).
columns:
  ready: "Ready"
  building: "In Progress"
  review: "Review"
  done: "Done"
  needs_design: "Needs Design"
  needs_human: "Needs Human"
  backlog: "Backlog"
status_field: "Status"
type_field: "Kind"

# ── Plan grouping ───────────────────────────────────────────────────────────
# Cards are grouped into "plans" by the value of `plan_field` on the project.
# Suggested setup: add a single-select field "Plan" on the project with one
# option per spec-kit feature slug (matches the directory name under specs/).
plan_field: "Plan"

# ── Concurrency ─────────────────────────────────────────────────────────────
# Global cap shared by active ticket builders and the current reviewer.
# Capped at 16.
max_workers: 2

# Polling interval (seconds) of the autonomous loop. 60-120 is recommended
# to stay well within the GitHub GraphQL rate-limit budget.
tick_seconds: 90

# ── Branch / PR strategy ────────────────────────────────────────────────────
branches:
  base: "main" # PR target
  plan_prefix: "plan/" # branch prefix for the long-lived plan branch
  # Branch prefix for short-lived per-task branches.
  task_prefix: "task/"

# How a manually accepted task is merged after its GitHub issue is closed:
#   "squash" -> one commit per task on plan/<slug> (recommended, clean PR)
#   "merge"  -> preserve full commit history of each task branch
task_merge_strategy: "squash"

# ── PR behaviour ────────────────────────────────────────────────────────────
pr:
  # Reviewers requested on the plan PR. Each entry is a GitHub login or
  # `org/team-slug` (for team reviewers). Empty list -> no reviewers requested.
  # The PR is always opened as a normal (non-draft) PR.
  reviewers: []
  # Optional template path (relative to repo root) used for the PR body.
  # Falls back to a generated summary of the plan's tasks if missing.
  body_template: ".github/PULL_REQUEST_TEMPLATE.md"
  # Labels added to the plan PR (auto-created on the repo if missing).
  labels:
    - "board-agent"

# ── Builder model routing ───────────────────────────────────────────────────
# Maps to pi-dynamic-workflows tiers configured via `/workflows-models`.
# Each builder agent runs in a worktree under this tier.
builder_tier: "medium"

# Optional: hard timeout per builder agent (milliseconds). Omit for no cap.
builder_timeout_ms: 1800000 # 30 min

# Retries for a recoverable failure (timeout, empty output, connection drop).
builder_retries: 1

# ── LLM models (parametrizzabili) ───────────────────────────────────────────
# Explicit model id used for each role. When set, it takes precedence over
# the tier. Use "provider/modelId" or a bare modelId resolvable by pi.
models:
  builder: "deepseek-v4-flash-0731"
  refine: "deepseek-v4-flash-0731"
  review: "deepseek-v4-flash-0731"
  watch: "deepseek-v4-flash-0731"

# ── Builder context (repo digest) ───────────────────────────────────────────
# Deterministic markdown digest injected into every builder mission so the
# agent starts oriented without exploring the repo (saves tokens).
# Regenerated automatically when the git HEAD changes.
context:
  enabled: true
  max_chars: 20000 # ~5K tokens
  exclude: [] # extra paths/globs to exclude from the digest

# ── Refine phase (Stories and Task contracts) ───────────────────────────────
# `enabled` controls both Story refinement and Needs Design Task contract
# refinement. Stories produce sub-issues; Tasks wait for a fresh trusted
# design decision before their existing issue contract is rewritten.
refine:
  enabled: true
  timeout_ms: 240000 # per-refine agent timeout
  max_tasks: 12 # safety cap on tasks created per story

# ── AI review gate ──────────────────────────────────────────────────────────
# Review cards are independently checked against their acceptance criteria.
# PASS → Done; FAIL → a findings comment is posted and the card returns to
# Ready.
review:
  enabled: false
  timeout_ms: 600000 # per-review agent timeout (10 min)

# ── Watchdog (PR CI + mentions) ───────────────────────────────────────
# Keeps bot-managed PRs healthy: auto-fix failing CI (max rounds, cooldown),
# then ask the human; replies to @bot mentions on its PRs.
watchdog:
  enabled: true
  interval_seconds: 300 # standalone /board-agent watchdog interval
  fix_rounds_max: 5 # max auto-fix rounds per PR before needs-human
  fix_cooldown_minutes: 5 # pause between fix attempts (CI needs time)
  respond_to_mentions: true
  pr_label: "board-agent"
  needs_human_label: "needs-human"

# ── Telegram notifications ────────────────────────────────────────────
# Same bot + channel used by the project releases. Token/chat id come from
# the environment (never stored here).
telegram:
  enabled: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"
  # Events: pr_opened, ci_fixed, needs_human, task_failed,
  # refine_questions, refine_done
  "on":
    - "pr_opened"
    - "ci_fixed"
    - "needs_human"
    - "task_failed"
    - "refine_questions"
    - "refine_done"

# ── Auto start (container) ──────────────────────────────────────────────────
# Start the loop automatically when the pi session starts (Docker/headless).
auto_start: false

# ── Safety rails ────────────────────────────────────────────────────────────
safety:
  # Refuse to launch new work if the main working tree is dirty. Existing
  # managed runs are still reconciled so one ticket cannot block the board.
  require_clean_worktree: true
  # Skip cards whose linked issue is already closed.
  skip_closed_issues: true

# ── Bot identity (optional) ─────────────────────────────────────────────────
# When set, board-agent uses this login for the assignee claim + refetch guard.
# Leave empty to use the gh-authenticated user.
bot_identity: ""
