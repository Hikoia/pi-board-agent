# pi-board-agent configuration
#
# Lives at `.pi/board-agent.yml` in your project (or `~/.pi/board-agent.yml` for
# defaults across projects — project-level overrides global). All fields are
# optional unless marked REQUIRED.
# Only Task Issues in the configured origin repository execute; AI review is always on.
# After config/Project changes: stop successfully, lint, then run a new loop.
# Package upgrades additionally require a new Pi process. Coherence is checked at
# startup/deployment/lint, never by heartbeat/UI/ordinary model admission polling.

# ── GitHub Project (v2) ─────────────────────────────────────────────────────
project:
  # GitHub user or org that owns the Project (v2).
  # Leave empty -> auto-detected from `git remote get-url origin`.
  owner: ""
  # REQUIRED. Project number — the N in
  # https://github.com/users/<owner>/projects/<N>
  number: 0

# ── Board columns (Status field) ────────────────────────────────────────────
# Names must match the option labels of the project's single-select `Status`
# field exactly (case-insensitive). Required: Ready, In Progress, Review, Done,
# Needs Human. Backlog is manual and need not exist on the Project.
columns:
  ready: "Ready"
  building: "In Progress"
  review: "Review"
  done: "Done"
  needs_human: "Needs Human"
  backlog: "Backlog"
status_field: "Status"
type_field: "Kind"

# ── Optional Plan grouping (read-only) ──────────────────────────────────────
# If this field exists, its value is retained for old data/status summaries.
# Tasks need no Plan value or field to build, review, or integrate.
plan_field: "Plan"

# ── Concurrency ─────────────────────────────────────────────────────────────
# Total model budget: builders + one foreground AI reviewer.
# Paused, pending, launching, missing/unreadable runs conservatively occupy slots.
# Reserve one review slot, pre-fill builders, review, then back-fill. Capped at 16.
max_workers: 2

# Polling interval (seconds) of the autonomous loop. Requests depend on board
# size, pagination and active work; this interval is not a rate-limit guarantee.
tick_seconds: 90

# ── Branch strategy ─────────────────────────────────────────────────────────
branches:
  base: "main" # direct merge target after a Done issue is closed
  # Branch prefix for short-lived per-Issue task branches (`task/issue-42`).
  task_prefix: "task/"

# New integrations always preserve task history with a normal two-parent merge.
# The base must permit merge commits and ordinary bot pushes (no PR/force fallback).
# User validates open Done and manually closes before merge/push and safe cleanup.
# Old files containing "squash" are normalized to "merge" with a warning;
# recorded old squash results are adopted, not rewritten.
task_merge_strategy: "merge"

# ── Builder execution ───────────────────────────────────────────────────────
# Optional: hard timeout per builder agent (milliseconds). Omit for no cap.
builder_timeout_ms: 21600000 # 6 hours per attempt

# Retries for a recoverable failure (timeout, empty output, connection drop).
builder_retries: 1

# ── LLM models (parametrizzabili) ───────────────────────────────────────────
# Explicit model id used for each role. Use "provider/modelId" or a bare
# modelId resolvable by Pi.
models:
  builder: "deepseek-v4-flash-0731"
  review: "deepseek-v4-flash-0731"

# ── Builder context (repo digest) ───────────────────────────────────────────
# Navigation digest rendered from the prepared ticket worktree on new launches,
# not the host checkout cache. Read relevant code; the worktree is authoritative.
# No digest file is written into the ticket worktree; resumed runs keep their mission.
context:
  enabled: true
  max_chars: 20000 # ~5K tokens
  exclude: [] # extra paths/globs to exclude from the digest

# ── AI review gate (always enabled) ─────────────────────────────────────────
# PASS → Done (Issue stays open for manual validation).
# FAIL → Ready on the same branch/worktree. Technical review failures retry review.
# Only a complete missing human decision goes to Needs Human. A trusted reply alone
# does not resume: manually move to Ready too. Technical failures retry by stage;
# unfinished comment/status/reopen/release I/O settles before another model.
# Close the reviewed Done Issue to approve merge/push and safe task cleanup.
review:
  timeout_ms: 600000 # per-review agent timeout (10 min)

# ── Telegram notifications ────────────────────────────────────────────
# Same bot + channel used by the project releases. Token/chat id come from
# the environment (never stored here).
telegram:
  enabled: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"
  # Events: needs_human
  "on":
    - "needs_human"

# ── Auto start ──────────────────────────────────────────────────────────────
# Start the loop automatically when a normal Pi session starts.
auto_start: false

# ── Safety rails ────────────────────────────────────────────────────────────
safety:
  # Refuse to launch new work if the main working tree is dirty. Only untracked
  # runtime paths are excluded; tracked source/config changes always block.
  # Existing managed runs are still reconciled;
  # one ticket cannot block the board.
  require_clean_worktree: true
# Closed Issues never start builders, regardless of legacy preferences.

# ── Bot identity (optional) ─────────────────────────────────────────────────
# When set, board-agent uses this login for the assignee claim + refetch guard.
# Leave empty to use the gh-authenticated user.
bot_identity: ""
